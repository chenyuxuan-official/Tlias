spring.application.name=app
spring.profiles.active=dev

# 数据源配置
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/tlias?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
spring.datasource.username=root
# 真实密码写在 application-dev.properties（该文件已被 .gitignore 排除，不会进仓库）
# 本地运行前请复制 application-dev.properties.example 为 application-dev.properties 并填入自己的密码
spring.datasource.password=${DB_PASSWORD:changeme}

# MyBatis 配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.shanfu.app.pojo
mybatis.configuration.map-underscore-to-camel-case=true
# MyBatis 日志走 SLF4J (logback)，SQL 会以 DEBUG 级别输出
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

# Spring 事务管理日志：观察事务创建、提交、回滚
logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.jdbc=DEBUG

# 文件上传大小限制
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# 阿里云 OSS 配置
aliyun.oss.endpoint=https://oss-cn-beijing.aliyuncs.com
aliyun.oss.bucketName=shanfu-test-bucket-123
aliyun.oss.region=cn-beijing
